name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Image sizes
        run: npm run check:images
      - name: Links
        run: npm run check:links

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, light and dark)
        run: npm run test:a11y
      - name: Lighthouse
        run: npx lhci autorun --config=lighthouserc.cjs

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            .lighthouseci/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
